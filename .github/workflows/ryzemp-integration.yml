name: RyzeMP VanillaMine-base integration

on:
  push:
    branches:
      - integration/vanillamine-base
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ryzemp-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: PHP 8.4 / multiversion regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: '8.4'
          install-path: ./bin
          pm-version-major: 5
      - name: Validate Composer metadata
        run: composer validate --no-check-publish --no-interaction
      - name: Install exactly locked published dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Verify PHP syntax
        run: find src generated tests/phpunit -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /tmp/ryzemp-php-lint.log
      - name: Test multiversion, authenticated NetherNet and same-port HTTP/TLS regressions
        run: |
          php -d memory_limit=2G vendor/bin/phpunit --bootstrap vendor/autoload.php tests/phpunit/network/mcpe/convert/ProtocolPaletteTest.php
          php -d memory_limit=2G vendor/bin/phpunit --bootstrap vendor/autoload.php tests/phpunit/network/mcpe/InventorySlotContainerNameTest.php
          php -d memory_limit=2G vendor/bin/phpunit --bootstrap vendor/autoload.php tests/phpunit/network/mcpe/StandardEntityEventBroadcasterTest.php
          php -d memory_limit=2G vendor/bin/phpunit --bootstrap vendor/autoload.php tests/phpunit/network/mcpe/ryzertc/NetherNetHttpServerTest.php

  full-suite:
    name: Full PHPUnit suite (release gate)
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: '8.4'
          install-path: ./bin
          pm-version-major: 5
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run full PHPUnit regression suite
        run: php -d memory_limit=2G vendor/bin/phpunit --bootstrap vendor/autoload.php --display-skipped --fail-on-warning tests/phpunit

  phar:
    name: Build unmerged RyzeMP PHAR candidate
    runs-on: ubuntu-24.04
    needs: regression
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: '8.4'
          install-path: ./bin
          pm-version-major: 5
      - name: Install locked production dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev --classmap-authoritative
      - name: Download verified standalone RyzeVanillaGen native release for Linux
        env:
          NATIVE_TARGETS: linux/amd64
        run: bash build/ci/build-native.sh "integration-$GITHUB_RUN_NUMBER"
      - name: Build RyzeMP archive
        run: |
          php -d phar.readonly=0 build/server-phar.php --out=RyzeMP.phar --git="$GITHUB_SHA" --build="$GITHUB_RUN_NUMBER"
          test -s RyzeMP.phar
          php -r '$p = new Phar("RyzeMP.phar"); if($p->count() < 100) throw new RuntimeException("Empty PHAR"); foreach(new RecursiveIteratorIterator($p) as $f){if(str_ends_with($f->getPathname(), ".so") || str_contains($f->getPathname(), "pm-nethernet")) throw new RuntimeException("Legacy/native binary inside PHAR");} if(isset($p["native/vanillagen/bin/vanillagen-linux-amd64"])) throw new RuntimeException("Go must remain outside PHAR");'
          sha256sum RyzeMP.phar > RyzeMP.phar.sha256
      - name: Check archive version entry point
        run: php RyzeMP.phar --version
      - name: Headless world start smoke (non-retail)
        run: |
          mkdir -p "$RUNNER_TEMP/ryzemp-smoke/plugins"
          cp resources/pocketmine.yml "$RUNNER_TEMP/ryzemp-smoke/pocketmine.yml"
          sed -i "s/enable-dev-builds: false/enable-dev-builds: true/" "$RUNNER_TEMP/ryzemp-smoke/pocketmine.yml"
          # This smoke intentionally exercises RakNet-only startup without native PHP modules.
          printf 'server-ip=0.0.0.0\nserver-port=19132\nenable-nethernet=off\n' > "$RUNNER_TEMP/ryzemp-smoke/server.properties"
          set +e
          RYZEMP_VANILLAGEN_BINARY="$PWD/native/vanillagen/bin/vanillagen-linux-amd64" timeout --signal=INT --kill-after=10s 75s php -d memory_limit=2G RyzeMP.phar --no-wizard --disable-ansi --no-log-file --data="$RUNNER_TEMP/ryzemp-smoke" --plugins="$RUNNER_TEMP/ryzemp-smoke/plugins" > "$RUNNER_TEMP/ryzemp-smoke.log" 2>&1
          code=$?
          set -e
          tail -n 120 "$RUNNER_TEMP/ryzemp-smoke.log"
          if grep -Eiq 'Fatal error|Uncaught |\[.*(CRITICAL|EMERGENCY).*\]' "$RUNNER_TEMP/ryzemp-smoke.log"; then
            echo 'Server reported a fatal boot error' >&2
            exit 1
          fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "Boot smoke exited with code $code" >&2
            exit 1
          fi
          grep -Eq 'Done \(|For help, type|Server started' "$RUNNER_TEMP/ryzemp-smoke.log" || {
            echo 'Server did not reach completed-startup state' >&2
            exit 1
          }
      - name: Headless legacy pocketmine.yml startup and preservation smoke
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ryzemp-legacy/plugins"
          cp tests/fixtures/legacy-pocketmine.yml "$RUNNER_TEMP/ryzemp-legacy/pocketmine.yml"
          before="$(sha256sum "$RUNNER_TEMP/ryzemp-legacy/pocketmine.yml" | cut -d ' ' -f1)"
          # Keep existing-world settings and port; no modification to the legacy YAML.
          printf 'server-ip=0.0.0.0\nserver-port=19132\nenable-nethernet=off\nlevel-type=flat\n' > "$RUNNER_TEMP/ryzemp-legacy/server.properties"
          set +e
          timeout --signal=INT --kill-after=10s 65s php -d memory_limit=2G RyzeMP.phar \
            --no-wizard --disable-ansi --no-log-file \
            --data="$RUNNER_TEMP/ryzemp-legacy" --plugins="$RUNNER_TEMP/ryzemp-legacy/plugins" \
            > "$RUNNER_TEMP/ryzemp-legacy.log" 2>&1
          code=$?
          set -e
          tail -n 100 "$RUNNER_TEMP/ryzemp-legacy.log"
          test "$code" -eq 0 -o "$code" -eq 124
          ! grep -Eiq 'Fatal error|Uncaught |\[.*(CRITICAL|EMERGENCY).*\]' "$RUNNER_TEMP/ryzemp-legacy.log"
          grep -Eq 'Done \(|For help, type|Server started' "$RUNNER_TEMP/ryzemp-legacy.log"
          after="$(sha256sum "$RUNNER_TEMP/ryzemp-legacy/pocketmine.yml" | cut -d ' ' -f1)"
          test "$before" = "$after"
      - name: Upload test build (never a production release)
        uses: actions/upload-artifact@v7
        with:
          name: RyzeMP-vanillamine-integration-phar
          path: |
            RyzeMP.phar
            RyzeMP.phar.sha256
            native/vanillagen/bin/vanillagen-linux-amd64
          if-no-files-found: error
          retention-days: 7

  native-ryzertc:
    name: Native RyzeRTC API 2 PHAR startup (external module)
    needs: phar
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: '8.4'
          install-path: ./bin
          pm-version-major: 5
      - uses: actions/download-artifact@v8
        with:
          name: RyzeMP-vanillamine-integration-phar
          path: .
      - name: Download official pinned RyzeRTC API 2 release outside PHAR
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ryzertc-external"
          curl --fail --location --retry 3 --proto '=https' \
            'https://github.com/RyzeCompany/RyzeRTC/releases/download/v0.1.0-dev.3/ryzertc-linux-x86_64-php84-zts.zip' \
            -o "$RUNNER_TEMP/ryzertc-external/ryzertc.zip"
          echo "9ecea6cc9d239b8c583d042c91df0448432321ceaf128850fe5b27bcde234602  $RUNNER_TEMP/ryzertc-external/ryzertc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ryzertc-external/ryzertc.zip" -d "$RUNNER_TEMP/ryzertc-external"
          cd "$RUNNER_TEMP/ryzertc-external"
          sha256sum -c SHA256SUMS.txt
          test -f ryzertc.so
          test -d lib
          echo "RYZERTC_NATIVE_DIR=$RUNNER_TEMP/ryzertc-external" >> "$GITHUB_ENV"
      - name: Validate native PHP API and external library
        run: |
          set -euo pipefail
          php -r 'exit(PHP_VERSION_ID >= 80400 && PHP_VERSION_ID < 80500 && PHP_ZTS && PHP_INT_SIZE === 8 ? 0 : 1);'
          LD_LIBRARY_PATH="$RYZERTC_NATIVE_DIR/lib" php -d "extension=$RYZERTC_NATIVE_DIR/ryzertc.so" -r '
            if (!extension_loaded("ryzertc") || RyzeRTC\Runtime::apiVersion() < 2) exit(1);
            echo RyzeRTC\Runtime::version(), " API ", RyzeRTC\Runtime::apiVersion(), "\n";'
      - name: Boot PHAR using exclusive native RyzeRTC
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ryzertc-smoke/plugins"
          cp resources/pocketmine.yml "$RUNNER_TEMP/ryzertc-smoke/pocketmine.yml"
          sed -i 's/enable-dev-builds: false/enable-dev-builds: true/' "$RUNNER_TEMP/ryzertc-smoke/pocketmine.yml"
          set +e
          timeout --signal=INT --kill-after=10s 120s env LD_LIBRARY_PATH="$RYZERTC_NATIVE_DIR/lib" \
            php -d "extension=$RYZERTC_NATIVE_DIR/ryzertc.so" -d memory_limit=2G \
            RyzeMP.phar --no-wizard --disable-ansi --no-log-file \
            --data="$RUNNER_TEMP/ryzertc-smoke" --plugins="$RUNNER_TEMP/ryzertc-smoke/plugins" \
            > "$RUNNER_TEMP/ryzertc-smoke.log" 2>&1
          code=$?
          set -e
          tail -n 130 "$RUNNER_TEMP/ryzertc-smoke.log"
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "Native RyzeRTC PHAR exited unexpectedly with code $code" >&2
            exit 1
          fi
          if grep -Eiq 'Fatal error|Uncaught |\[.*(CRITICAL|EMERGENCY).*\]' "$RUNNER_TEMP/ryzertc-smoke.log"; then
            echo "Native transport reported a fatal startup error" >&2
            exit 1
          fi
          grep -Fq 'Native RyzeRTC API 2 using TCP/UDP 19132' "$RUNNER_TEMP/ryzertc-smoke.log"
          grep -Eq 'Done \(|For help, type|Server started' "$RUNNER_TEMP/ryzertc-smoke.log"
          if grep -Eq 'Bridge 0\\.1\\.2|pm-nethernet' "$RUNNER_TEMP/ryzertc-smoke.log"; then
            echo 'Legacy NetherNet Go bridge was invoked' >&2
            exit 1
          fi
          grep -Fq 'NetherNet READY' "$RUNNER_TEMP/ryzertc-smoke.log"
