name: Verify public Packagist Bedrock dependencies

on:
  pull_request:
    paths:
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/packagist-public-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/packagist-public-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-packagist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install tagged dependencies from public Packagist only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ryzemp-packagist-smoke
          cd /tmp/ryzemp-packagist-smoke
          composer init --no-interaction --name=ryzecompany/packagist-smoke --type=project
          composer require --no-interaction --no-progress --prefer-dist --ignore-platform-reqs --no-scripts --no-audit \
            'ryzemcbe/bedrock-protocol:1.0.0-beta.1' \
            'ryzemcbe/bedrock-data:1.0.0-beta.1'
          php -r '
          $lock = json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR);
          $required = [
              "ryzemcbe/bedrock-protocol" => "https://github.com/RyzeCompany/BedrockProtocol.git",
              "ryzemcbe/bedrock-data" => "https://github.com/RyzeCompany/BedrockData.git",
          ];
          foreach ($required as $name => $sourceUrl) {
              $found = null;
              foreach ($lock["packages"] as $package) {
                  if ($package["name"] === $name) {
                      $found = $package;
                      break;
                  }
              }
              if ($found === null || ltrim($found["version"], "v") !== "1.0.0-beta.1" || ($found["source"]["url"] ?? "") !== $sourceUrl) {
                  fwrite(STDERR, "Unexpected Packagist package: " . $name . PHP_EOL);
                  exit(1);
              }
              echo $name . " " . $found["version"] . " from " . $sourceUrl . PHP_EOL;
          }
          '
