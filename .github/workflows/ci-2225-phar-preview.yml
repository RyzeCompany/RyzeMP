name: Experimental 2225 NetherNet PHAR

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [feature/bedrock-1.26.60-nethernet]
    paths:
      - ".github/workflows/ci-2225-phar-preview.yml"
      - "tests/phpunit/network/mcpe/nethernet/**"
      - "src/network/mcpe/nethernet/**"
      - "src/Server.php"
      - "src/network/mcpe/raklib/**"
      - "src/network/mcpe/NetworkSession.php"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: '8.4'
          install-path: ./pm-bin
          pm-version-major: 5
      - name: Checkout staged 2225 libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deps
          git clone --depth 1 --branch feature/bedrock-1.26.60-nethernet \
            https://github.com/RyzeCompany/BedrockProtocol.git deps/BedrockProtocol
          git clone --depth 1 --branch feature/bedrock-1.26.60-nethernet \
            https://github.com/RyzeCompany/BedrockData.git deps/BedrockData
          git clone --depth 1 https://github.com/Amber-PM/NetherNet.git deps/NetherNet
          python3 - <<'PY'
          from pathlib import Path
          p=Path("deps/BedrockProtocol/src/ProtocolInfo.php")
          s=p.read_text()
          assert "public const CURRENT_PROTOCOL = self::PROTOCOL_1_26_52;" in s
          s=s.replace("public const CURRENT_PROTOCOL = self::PROTOCOL_1_26_52;", "public const CURRENT_PROTOCOL = self::PROTOCOL_1_26_60;")
          s=s.replace("self::CURRENT_PROTOCOL,", "self::PROTOCOL_1_26_52,\n\t\tself::CURRENT_PROTOCOL,", 1)
          s=s.replace("public const MINECRAFT_VERSION = 'v26.52';", "public const MINECRAFT_VERSION = 'v26.60';")
          s=s.replace("public const MINECRAFT_VERSION_NETWORK = '1.26.52';", "public const MINECRAFT_VERSION_NETWORK = '1.26.60';")
          p.write_text(s)
          PY
      - name: Install staged protocol data and NetherNet without native rtc at build time
        shell: bash
        run: |
          set -euo pipefail
          composer config --json repositories.stage-protocol \
            '{"type":"path","url":"deps/BedrockProtocol","options":{"symlink":false,"versions":{"ryzemcbe/bedrock-protocol":"dev-feature/bedrock-1.26.60-nethernet"}}}'
          composer config --json repositories.stage-data \
            '{"type":"path","url":"deps/BedrockData","options":{"symlink":false,"versions":{"ryzemcbe/bedrock-data":"dev-feature/bedrock-1.26.60-nethernet"}}}'
          composer config --json repositories.stage-nethernet \
            '{"type":"path","url":"deps/NetherNet","options":{"symlink":false,"versions":{"amber-pm/nethernet":"dev-main"}}}'
          composer require --no-interaction --no-progress --with-all-dependencies \
            --ignore-platform-req=ext-rtc \
            "ryzemcbe/bedrock-protocol:dev-feature/bedrock-1.26.60-nethernet" \
            "ryzemcbe/bedrock-data:dev-feature/bedrock-1.26.60-nethernet" \
            "amber-pm/nethernet:dev-main"
          composer install --no-interaction --no-progress --no-dev --classmap-authoritative --ignore-platform-req=ext-rtc
      - name: Verify staged protocol and PHP source
        shell: bash
        run: |
          set -euo pipefail
          php -r 'require "vendor/autoload.php"; if(\pocketmine\network\mcpe\protocol\ProtocolInfo::CURRENT_PROTOCOL !== 2225 || !class_exists(\amber\nethernet\Transport::class)){exit(1);} echo "2225 and NetherNet staged\n";'
          find src lib generated tests/phpunit/network/mcpe/nethernet -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
          composer install --no-interaction --no-progress --ignore-platform-req=ext-rtc
          php -d memory_limit=2G vendor/bin/phpunit --bootstrap vendor/autoload.php tests/phpunit/network/mcpe/nethernet
      - name: Build and validate candidate PHAR
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --no-progress --no-dev --classmap-authoritative --ignore-platform-req=ext-rtc
          php -d phar.readonly=0 build/server-phar.php --out=RyzeMP-2225-NetherNet-EXPERIMENTAL.phar
          test -s RyzeMP-2225-NetherNet-EXPERIMENTAL.phar
          php -r '$p=new Phar("RyzeMP-2225-NetherNet-EXPERIMENTAL.phar"); echo "PHAR entries: ".$p->count().PHP_EOL;'
          php RyzeMP-2225-NetherNet-EXPERIMENTAL.phar --version
          sha256sum RyzeMP-2225-NetherNet-EXPERIMENTAL.phar > SHA256SUMS.txt
      - name: Smoke test headless startup and explicit missing-native diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ryzemp-2225-smoke/plugins
          cp resources/pocketmine.yml /tmp/ryzemp-2225-smoke/pocketmine.yml
          sed -i 's/enable-dev-builds: false/enable-dev-builds: true/' /tmp/ryzemp-2225-smoke/pocketmine.yml
          set +e
          timeout 35s php RyzeMP-2225-NetherNet-EXPERIMENTAL.phar \
            --no-wizard --disable-ansi \
            --data=/tmp/ryzemp-2225-smoke \
            --plugins=/tmp/ryzemp-2225-smoke/plugins \
            > /tmp/ryzemp-2225-smoke.log 2>&1
          exit_code=$?
          set -e
          tail -n 80 /tmp/ryzemp-2225-smoke.log
          if grep -Eiq 'Fatal error|Uncaught|CRITICAL|EMERGENCY' /tmp/ryzemp-2225-smoke.log; then
            echo 'Server failed to start cleanly with 2225 staging'
            exit 1
          fi
          grep -q 'NetherNet UNAVAILABLE: PHP native extension' /tmp/ryzemp-2225-smoke.log
          if [[ "$exit_code" -ne 0 && "$exit_code" -ne 124 ]]; then
            echo "Unexpected exit code: $exit_code"
            exit "$exit_code"
          fi
      - name: Upload downloadable PHAR candidate
        uses: actions/upload-artifact@v4
        with:
          name: RyzeMP-2225-NetherNet-EXPERIMENTAL
          path: |
            RyzeMP-2225-NetherNet-EXPERIMENTAL.phar
            SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
