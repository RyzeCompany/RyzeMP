name: One-time cleanup of merged Composer work branches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-clean-merged-composer-branches.yml'
permissions:
  contents: write
jobs:
  remove-merged-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only merged Composer branches with unchanged heads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while read -r branch expected; do
            [[ -z "${branch}" ]] && continue
            ref="repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}"
            if ! current="$(gh api "${ref}" --jq '.object.sha' 2>/dev/null)"; then
              echo "SKIPPED missing branch: ${branch}"
              continue
            fi
            if [[ "${current}" != "${expected}" ]]; then
              echo "::error::Branch ${branch} has changed since merge, refusing deletion."
              exit 1
            fi
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "DELETED ${branch}"
          done <<'MERGED_BRANCHES'
          chore/composer-packagist-beta3 85d7bde5fe7bb5d07801728bbbe7508d0c8f0cfe
          chore/composer-packagist-direct 0ca693ec1d9ee988174877593bab919075c185a7
          chore/pin-bedrock-beta1 4898cb9788fbbda81fef595a3537614f3bd2a30a
          ci/verify-packagist-create-project-beta3 51b28e4bb3309cdbd1751275776e3b130925bec7
          ci/verify-public-packagist-dependencies 45f1dd3647b62da64cbcd89a2b808984f41ccd62
          docs/announce-public-beta3-distribution a6cd1aae9c7018bff7e9de7d2bc4f8a057addf66
          MERGED_BRANCHES
