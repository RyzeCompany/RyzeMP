name: VanillaMine weather static analysis
on:
  pull_request:
    paths:
      - 'src/world/weather/**'
      - 'src/entity/object/LightningBolt.php'
      - 'src/event/world/LightningStrikeEvent.php'
      - 'src/entity/Entity.php'
      - 'src/block/**'
      - 'src/world/GameRules.php'
      - 'src/data/bedrock/block/convert/VanillaBlockMappings.php'
      - 'src/item/PowderSnowBucket.php'
      - 'src/item/VanillaItemsInputs.php'
      - 'src/world/sound/Cauldron*PowderSnowSound.php'
      - 'tests/phpunit/world/weather/**'
      - 'tests/phpunit/block/LightningRodPowerTest.php'
      - 'tests/phpunit/block/PowderSnowCauldronTest.php'
      - '.github/workflows/vanillamine-weather-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpstan-weather:
    name: PHPStan level 9 - weather integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: '8.4'
          install-path: ./bin
          pm-version-major: 5
      - name: Install locked development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare generated PHPStan excluded directory
        run: mkdir -p build/php
      - name: Analyze weather and integration contracts
        run: |
          php -d memory_limit=2G vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --memory-limit=2G --no-progress \
            src/world/weather \
            src/entity/object/LightningBolt.php \
            src/event/world/LightningStrikeEvent.php \
            src/event/entity/EntityDamageEvent.php \
            src/entity/Entity.php \
            src/world/World.php \
            src/block/Block.php \
            src/block/Cauldron.php \
            src/block/WaterCauldron.php \
            src/block/LightningRod.php \
            src/block/PowderSnowCauldron.php \
            src/world/GameRules.php \
            src/data/bedrock/block/convert/VanillaBlockMappings.php \
            src/item/PowderSnowBucket.php \
            src/item/VanillaItemsInputs.php \
            src/world/sound/CauldronFillPowderSnowSound.php \
            src/world/sound/CauldronEmptyPowderSnowSound.php \
            tests/phpunit/block/LightningRodPowerTest.php \
            tests/phpunit/block/PowderSnowCauldronTest.php \
            tests/phpunit/world/weather
