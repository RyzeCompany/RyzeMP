name: Publish RyzeMP 2225 experimental PHAR for Egg

on:
  push:
    branches: [feature/bedrock-1.26.60-nethernet]
    paths: ['.github/workflows/publish-2225-staging-phar.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify proven CI build and source ancestry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha='3cff1a996c75a08273af8cbce61e2a0b32166953'
          run='41156848305'
          git merge-base --is-ancestor "$source_sha" "$GITHUB_SHA"
          git diff --exit-code "$source_sha" "$GITHUB_SHA" -- src build lib generated resources composer.json composer.lock
          result="$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
          head="$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"
          test "$result" = success
          test "$head" = "$source_sha"
      - name: Download exact experimental 2225 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 41156848305 --repo "$GITHUB_REPOSITORY" \
            --name RyzeMP-2225-RyzeRTC-STAGING --dir package
          cd package
          test -s RyzeMP-2225-RyzeRTC-STAGING.phar
          test -s SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          test "$(stat -c %s RyzeMP-2225-RyzeRTC-STAGING.phar)" -gt 1000000
      - name: Publish explicit staging prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='ryzemp-2225-ryzertc-integration.1'
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title 'RyzeMP 2225 · authenticated RyzeRTC integration (client validation pending)' \
              --notes 'Bedrock protocol 2225 / 1.26.60 PHAR with first-party RyzeRTC API 2 integration. Built and tested by GitHub Actions 41156848305 from 3cff1a996c75a08273af8cbce61e2a0b32166953. Replaces TCP diagnostics with real authenticated GET metadata and signed full-ICE SDP answers, official HTTPS JWKS verification and renewal, persistent server identity, shared RakLib UDP, verified DataChannels and Minecraft session gateway. CI passes real TCP/UDP/native ICE-DTLS-SCTP binary transport, concurrent sessions and reconnect tests, and actual PHAR startup/restart using live official JWKS with a real legacy RakNet pong on the same public port. Requires RyzeRTC v0.1.0-dev.3 outside the PHAR; Egg installs it separately. Retail Minecraft Bedrock 1.26.60 login, world gameplay and public-host NAT validation are still pending. Terracotta is NOT declared fixed until those client tests pass. Preserve nethernet/operator-key.pem and server data. No Amber dependency; HardCoreFactions unchanged; PR remains unmerged.'
          fi
          gh release upload "$tag" \
            package/RyzeMP-2225-RyzeRTC-STAGING.phar package/SHA256SUMS.txt package/native-phar-smoke.log \
            --repo "$GITHUB_REPOSITORY" --clobber
