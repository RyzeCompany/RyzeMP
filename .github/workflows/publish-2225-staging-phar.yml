name: Publish RyzeMP 2225 experimental PHAR for Egg

on:
  push:
    branches: [feature/bedrock-1.26.60-nethernet]
    paths: ['.github/workflows/publish-2225-staging-phar.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify proven CI build and source ancestry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha='07a8f0558fed1e2f78ff10b109cde5fb967251d3'
          run='41158537688'
          git merge-base --is-ancestor "$source_sha" "$GITHUB_SHA"
          git diff --exit-code "$source_sha" "$GITHUB_SHA" -- src build lib generated resources composer.json composer.lock
          result="$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
          head="$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"
          test "$result" = success
          test "$head" = "$source_sha"
      - name: Download exact experimental 2225 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 41158537688 --repo "$GITHUB_REPOSITORY" \
            --name RyzeMP-2225-RyzeRTC-STAGING --dir package
          cd package
          test -s RyzeMP-2225-RyzeRTC-STAGING.phar
          test -s SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          test "$(stat -c %s RyzeMP-2225-RyzeRTC-STAGING.phar)" -gt 1000000
      - name: Publish explicit staging prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='ryzemp-2225-ryzertc-integration.2'
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title 'RyzeMP 2225 · chorus plant pre-spawn fix (retail retest required)' \
              --notes 'Fixes a reproduced server-side AssumptionFailedError after verified retail NetherNet login: minecraft:chorus_plant creative inventory serialization was missing normalization of minecraft:connection_up/down. Both vertical flags are now normalized only for the server model while all 64 original network variants and hashes are retained. Also routes protocol 2225 to the existing official 1.26.60 item-tag data and logs unexpected session source/stack without trace arguments. Built and tested from 07a8f0558fed1e2f78ff10b109cde5fb967251d3 by GitHub Actions 41158537688. Tests cover all 1696 implemented creative entries, 2225 and legacy creative/crafting wire round trips, the complete authenticated native shared-port transport, live official JWKS startup/restart, and the actual PHAR with a synthetic server-side player completing pre-spawn, terrain generation, world spawn and disconnect. The temporary test plugin is excluded from the released PHAR. Keep RyzeRTC v0.1.0-dev.3 outside the PHAR and existing server-ip/server-port. Retail client world entry and gameplay must be retried on the real host; this release does not declare Terracotta definitively solved. No authentication bypass, Amber dependency, main merge or HardCoreFactions change.'
          fi
          gh release upload "$tag" \
            package/RyzeMP-2225-RyzeRTC-STAGING.phar package/SHA256SUMS.txt package/native-phar-smoke.log package/native-prespawn-smoke.log \
            --repo "$GITHUB_REPOSITORY" --clobber
