name: Respawn test PHAR

on:
  push:
    branches:
      - fix/respawn-chunk-recovery-26x
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zlib
          ini-values: phar.readonly=Off
          tools: composer
      - name: Install locked production dependencies
        run: composer install --no-dev --classmap-authoritative --ignore-platform-reqs --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.SUBMODULE_TOKEN }}"}}'
      - name: Build PHAR
        run: php -d phar.readonly=0 build/server-phar.php --out=PocketMine-MP-respawn-test.phar
      - name: Validate PHAR and print checksum
        run: |
          test -s PocketMine-MP-respawn-test.phar
          php -r '$p = new Phar("PocketMine-MP-respawn-test.phar"); if($p->count() < 100){throw new RuntimeException("PHAR unexpectedly small");} echo "PHAR VALID: ".$p->count()." entries; ".filesize("PocketMine-MP-respawn-test.phar")." bytes\n";'
          sha256sum PocketMine-MP-respawn-test.phar
      - name: Publish isolated test prerelease (Actions artifact storage quota workaround)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create test-respawn-20261015 \
            PocketMine-MP-respawn-test.phar \
            --target "$GITHUB_SHA" \
            --title "Respawn + Chunk Recovery (test build)" \
            --notes "Unstable testing build from fix/respawn-chunk-recovery-26x. Includes late respawn action guard and chunk population retry recovery. Not merged to main. Test before using in production." \
            --prerelease
