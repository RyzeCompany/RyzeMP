name: Publish verified rtc runtime for RyzeMP Egg

on:
  push:
    branches:
      - feature/bedrock-1.26.60-nethernet
    paths:
      - .github/workflows/publish-rtc-egg-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download pinned ext-rtc Linux PHP 8.4.27 ZTS binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Verified upstream Amber-PM/ext-rtc workflow artifact from commit
          # e57c53411d4145fd8ea1504ccb1e2af239a04c29.
          # Copy before expiry to a stable, versioned RyzeMP GitHub release.
          curl --fail --location --silent --show-error --retry 3 \
            --connect-timeout 15 --max-time 240 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/Amber-PM/ext-rtc/actions/artifacts/12579589555/zip' \
            --output rtc-linux-8.4.27-zts.zip
          echo '18d9bf2e2b5c0822bccb88d433cdfeb6fce8ead6603a8b10859a732314d512a6  rtc-linux-8.4.27-zts.zip' | sha256sum --check --status
          unzip -t rtc-linux-8.4.27-zts.zip >/dev/null
          for item in \
            .build/rtc/extension/modules/rtc.so \
            .build/rtc/install/lib/libdatachannel.so.0.24 \
            .build/openssl/lib/libssl.so.3 \
            .build/openssl/lib/libcrypto.so.3 \
            .build/rtc/install/share/rtc/ext-rtc-LICENSE \
            .build/rtc/install/share/rtc/NOTICES.md; do
            unzip -Z1 rtc-linux-8.4.27-zts.zip | grep -Fx "$item" >/dev/null
          done
          unzip -p rtc-linux-8.4.27-zts.zip .build/rtc/logs/php-abi.json | \
            python3 -c 'import json,sys; a=json.load(sys.stdin); assert a["php"]=="8.4.27" and a["api"]==20240924 and a["zts"] and not a["debug"] and a["bits"]==64'
          mv rtc-linux-8.4.27-zts.zip ryzemp-rtc-linux-x86_64-php84-zts-v1.zip
          echo '18d9bf2e2b5c0822bccb88d433cdfeb6fce8ead6603a8b10859a732314d512a6  ryzemp-rtc-linux-x86_64-php84-zts-v1.zip' > SHA256SUMS.txt
      - name: Publish stable versioned runtime release for Egg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='ryzemp-rtc-php84-zts-v1'
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'RyzeMP RTC runtime · Linux x64 PHP 8.4 ZTS v1' \
              --notes 'Versioned verified Amber-PM/ext-rtc CI artifact for Linux PHP 8.4.27 ZTS. Needs compatible PHP 8.4 x64 ZTS and glibc 2.38+. Native dependencies, upstream license notices and checksums included. Used by the Pterodactyl Egg; not included in the PHAR.'
          fi
          gh release upload "$tag" \
            ryzemp-rtc-linux-x86_64-php84-zts-v1.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
