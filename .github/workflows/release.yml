name: Publish verified RyzeMP beta release

# Manual only: merging main must never silently release untested software.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "New immutable tag matching src/VersionInfo.php"
        required: true
        default: v1.0.0-beta.6

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    concurrency:
      group: ryzemp-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Require exact version and green main CI on this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*public const BASE_VERSION = "\([^"]*\)";.*/\1/p' src/VersionInfo.php)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || { echo "Not a beta version: $version" >&2; exit 1; }
          test "$RELEASE_TAG" = "v$version"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s "docs/releases/$version.md"
          test -s tools/ryzertc-runtime.json
          for workflow in ryzemp-integration.yml ryzemp-extended-coverage.yml; do
            url="repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&head_sha=$GITHUB_SHA&per_page=100"
            run="$(gh api "$url" | jq -r --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .conclusion == "success") | .id' | head -n 1)"
            if [[ ! "$run" =~ ^[0-9]+$ ]]; then
              echo "Missing successful main push CI for $workflow at $GITHUB_SHA" >&2
              exit 1
            fi
            echo "$workflow passed (run $run)"
            if [[ "$workflow" == ryzemp-integration.yml ]]; then echo "VERIFIED_RUN=$run" >> "$GITHUB_ENV"; fi
          done
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists: refuse to overwrite immutable assets." >&2
            exit 1
          fi
      - name: Download PHAR tested by the exact passed integration CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p package
          gh run download "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" \
            --name RyzeMP-vanillamine-integration-phar --dir package
          (cd package && sha256sum -c RyzeMP.phar.sha256)
          php -r '$p = new Phar("package/RyzeMP.phar"); if ($p->count() < 100) throw new RuntimeException("Invalid PHAR"); foreach (new RecursiveIteratorIterator($p) as $f) { $name = $f->getPathname(); if (str_ends_with($name, ".so") || str_contains($name, "pm-nethernet")) throw new RuntimeException("Native/old transport embedded"); } if (isset($p["native/vanillagen/bin/vanillagen-linux-amd64"])) throw new RuntimeException("Go embedded in PHAR");'
      - name: Prepare PHAR checksum and independent native dependency manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mv package/RyzeMP.phar "package/RyzeMP_$RELEASE_TAG.phar"
          (cd package && sha256sum "RyzeMP_$RELEASE_TAG.phar" > SHA256SUMS.txt)
          cp LICENSE COPYING package/
          python3 tools/release-manifest.py --release "$RELEASE_TAG" --channel pruebas \
            --phar "package/RyzeMP_$RELEASE_TAG.phar" --out package/ryzemp-update.json
          test "$(python3 -c 'import json; print(json.load(open("package/ryzemp-update.json"))["schema"])')" = 1
          (cd package && sha256sum -c SHA256SUMS.txt)
      - name: Publish new beta with Egg manifest uploaded last
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(echo "$RELEASE_TAG" | cut -c2-)"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "RyzeMP $version - VanillaMine multiversion beta" \
            --notes-file "docs/releases/$version.md"
          gh release upload "$RELEASE_TAG" \
            "package/RyzeMP_$RELEASE_TAG.phar" package/SHA256SUMS.txt \
            package/LICENSE package/COPYING --repo "$GITHUB_REPOSITORY"
          # The manifest is intentionally last: its presence enables Egg installation.
          gh release upload "$RELEASE_TAG" package/ryzemp-update.json --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
