name: Build and Release Phar

on:
  push:
    branches:
      - main
      - fix/chest-minecart-item
      - feature/native-nether-end
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zlib
          ini-values: phar.readonly=Off
          tools: composer

      - name: Verify PHAR compression support
        run: |
          php -r 'if(!extension_loaded("zlib") || !Phar::canCompress(Phar::GZ)){fwrite(STDERR, "Gzip PHAR compression is unavailable\\n"); exit(1);} echo "zlib + Phar::GZ compression available\\n";'

      - name: Install dependencies
        run: composer install --no-dev --classmap-authoritative --ignore-platform-reqs
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.SUBMODULE_TOKEN }}"}}'

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find src generated -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build phar
        run: php -d phar.readonly=0 build/server-phar.php --out=PocketMine-MP.phar

      - name: Validate phar
        run: |
          test -s PocketMine-MP.phar
          php -r '$p = new Phar("PocketMine-MP.phar"); $uncompressed=[]; foreach($p as $f){ if($f->isFile() && !$f->isCompressed(Phar::GZ)){ $uncompressed[]=$f->getPathName(); } } if($uncompressed!==[]){ fwrite(STDERR, "Uncompressed PHAR entries: " . count($uncompressed) . PHP_EOL . implode(PHP_EOL, array_slice($uncompressed, 0, 20)) . PHP_EOL); exit(1); } $size=filesize("PocketMine-MP.phar"); echo "PHAR OK: " . $p->getPath() . PHP_EOL; echo "FILES: " . $p->count() . PHP_EOL; echo "SIZE: " . $size . " bytes (" . round($size / 1048576, 2) . " MiB)" . PHP_EOL; if($size > 47185920){ fwrite(STDERR, "PHAR is unexpectedly large (>45 MiB) for this multi-version build" . PHP_EOL); exit(1); }'

      - name: Upload build artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: PocketMine-MP-phar-${{ github.sha }}
          path: PocketMine-MP.phar
          if-no-files-found: error

      - name: Rename phar
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv PocketMine-MP.phar PocketMine-MP_${{ github.ref_name }}.phar

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PocketMine-MP_${{ github.ref_name }}.phar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
