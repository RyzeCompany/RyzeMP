name: Build and Release Phar

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - fix/chest-minecart-item
      - feature/native-nether-end
      - fix/dimension-loading-screen-hcf
      - diagnostic/block-dimension-packet-trace
      - diagnostic/dimension-chunk-packet-validation
      - diagnostic/2193-pre-encryption-capture
      - fix/2193-ordered-dimension-transfer
      - fix/2193-allay-prespawn-contract
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zlib
          ini-values: phar.readonly=Off
          tools: composer

      - name: Vendor VanillaAltay structure templates
        if: github.ref == 'refs/heads/feature/native-nether-end'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f resources/dimension/structures/structures.nbt ]; then
            mkdir -p resources/dimension/structures
            curl -L --fail --retry 3 -o /tmp/VanillaAltay.phar \
              https://github.com/NaySurGithub/VanillaAltay/releases/download/latest/Vanilla-Altay-0.4.0.phar
            php -d phar.readonly=0 -r '
              $p = new Phar("/tmp/VanillaAltay.phar");
              $paths = [
                "resources/dimension/structures/structures.nbt",
                "dimension/structures/structures.nbt"
              ];
              foreach($paths as $path){
                if(isset($p[$path])){
                  file_put_contents("resources/dimension/structures/structures.nbt", $p[$path]->getContent());
                  exit(0);
                }
              }
              fwrite(STDERR, "structures.nbt not found in VanillaAltay PHAR\n");
              exit(1);
            '
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add resources/dimension/structures/structures.nbt
            git commit -m "Vendor VanillaAltay dimension structure templates"
            git push origin HEAD:feature/native-nether-end
          fi

      - name: Verify PHAR compression support
        run: |
          php -r 'if(!extension_loaded("zlib") || !Phar::canCompress(Phar::GZ)){fwrite(STDERR, "Gzip PHAR compression is unavailable\\n"); exit(1);} echo "zlib + Phar::GZ compression available\\n";'

      - name: Install dependencies
        run: composer install --no-dev --classmap-authoritative --ignore-platform-reqs
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.SUBMODULE_TOKEN }}"}}'

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find src generated -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build phar
        run: php -d phar.readonly=0 build/server-phar.php --out=PocketMine-MP.phar

      - name: Validate phar
        run: |
          test -s PocketMine-MP.phar
          php -r '$p = new Phar("PocketMine-MP.phar"); $uncompressed=[]; foreach($p as $f){ if($f->isFile() && !$f->isCompressed(Phar::GZ)){ $uncompressed[]=$f->getPathName(); } } if($uncompressed!==[]){ fwrite(STDERR, "Uncompressed PHAR entries: " . count($uncompressed) . PHP_EOL . implode(PHP_EOL, array_slice($uncompressed, 0, 20)) . PHP_EOL); exit(1); } $size=filesize("PocketMine-MP.phar"); echo "PHAR OK: " . $p->getPath() . PHP_EOL; echo "FILES: " . $p->count() . PHP_EOL; echo "SIZE: " . $size . " bytes (" . round($size / 1048576, 2) . " MiB)" . PHP_EOL; if($size > 47185920){ fwrite(STDERR, "PHAR is unexpectedly large (>45 MiB) for this multi-version build" . PHP_EOL); exit(1); }'

      - name: Setup PocketMine PHP for smoke test
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: '8.4'
          install-path: ./pm-bin
          pm-version-major: 5

      - name: Smoke-test native dimensions startup
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pm-native-dimensions-smoke
          mkdir -p /tmp/pm-native-dimensions-smoke/plugins
          cp resources/pocketmine.yml /tmp/pm-native-dimensions-smoke/pocketmine.yml
          sed -i 's/enable-dev-builds: false/enable-dev-builds: true/' /tmp/pm-native-dimensions-smoke/pocketmine.yml
          set +e
          timeout 35s php PocketMine-MP.phar             --no-wizard             --disable-ansi             --data=/tmp/pm-native-dimensions-smoke             --plugins=/tmp/pm-native-dimensions-smoke/plugins             > /tmp/pm-native-dimensions-smoke.log 2>&1
          status=$?
          set -e
          cat /tmp/pm-native-dimensions-smoke.log
          if grep -Eiq 'Fatal error|Uncaught|CRITICAL|EMERGENCY' /tmp/pm-native-dimensions-smoke.log; then
            echo "Fatal/critical startup error detected"
            exit 1
          fi
          grep -q 'Native dimensions: created world_nether' /tmp/pm-native-dimensions-smoke.log
          grep -q 'Native dimensions: created world_the_end' /tmp/pm-native-dimensions-smoke.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "Unexpected PocketMine exit code: $status"
            exit "$status"
          fi

      - name: Upload build artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: PocketMine-MP-phar-${{ github.sha }}
          path: PocketMine-MP.phar
          if-no-files-found: error

      - name: Rename phar
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv PocketMine-MP.phar PocketMine-MP_${{ github.ref_name }}.phar

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PocketMine-MP_${{ github.ref_name }}.phar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
