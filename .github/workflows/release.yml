name: Build and Release Phar

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
  build:
    needs: tests
    uses: ./.github/workflows/ci-2225-phar-preview.yml
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RyzeMP-phar
          path: package
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Build the exact pinned VanillaMine Go binary for the same release
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          VANILLAMINE_REVISION: 4dd2228b47d64c8015c28138c846e6c4acb28345
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/vanillamine-release"
          git -C "$RUNNER_TEMP/vanillamine-release" fetch --depth=1 https://gitlab.com/VanillaMine/VanillaMine.git "$VANILLAMINE_REVISION"
          git -C "$RUNNER_TEMP/vanillamine-release" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/vanillamine-release" rev-parse HEAD)" = "$VANILLAMINE_REVISION"
          (
            cd "$RUNNER_TEMP/vanillamine-release/native/vanillagen"
            go test -count=1 ./...
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/package/vanillagen-linux-amd64" .
          )
          test "$(package/vanillagen-linux-amd64 -version)" = 'vanillagen dev protocol 7 algorithm 4'
          sha256sum package/vanillagen-linux-amd64
      - name: Publish the verified beta PHAR and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*public const BASE_VERSION = "\([^"]*\)";.*/\1/p' src/VersionInfo.php)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]
          tag="v$version"
          channel=estable
          flags=(--draft)
          if [[ "$version" == *-* ]]; then channel=pruebas; flags+=(--prerelease); fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "$tag"; fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' > /tmp/release-draft; then
            if [[ "$(cat /tmp/release-draft)" != true ]]; then
              echo "$tag already published; its assets are preserved."
              exit 0
            fi
            draft_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$tag\") | .id")"
            [[ "$draft_id" =~ ^[0-9]+$ ]]
            draft_target="$(gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" --jq '.target_commitish')"
            if [[ "$draft_target" != "$GITHUB_SHA" ]]; then
              # An empty draft can be resumed after a publishing-only correction.
              test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" --jq '.assets | length')" = 0
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
            fi
          else
            test -s "docs/releases/$version.md"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${flags[@]}" \
              --title "RyzeMP $version · Bedrock 1.26.60 / RyzeRTC" --notes-file "docs/releases/$version.md"
          fi
          (cd package && sha256sum -c SHA256SUMS.txt)
          mv package/RyzeMP.phar "package/RyzeMP_${tag}.phar"
          (cd package && sha256sum "RyzeMP_${tag}.phar" > SHA256SUMS.txt)
          cp LICENSE package/LICENSE
          cp COPYING package/COPYING
          python3 tools/release-manifest.py --release "$tag" --channel "$channel" \
            --phar "package/RyzeMP_${tag}.phar" --go package/vanillagen-linux-amd64 --out package/ryzemp-update.json
          # Publish the manifest last; keep the release hidden until all files are ready.
          for name in "RyzeMP_${tag}.phar" vanillagen-linux-amd64 SHA256SUMS.txt LICENSE COPYING native-phar-smoke.log native-prespawn-smoke.log public-command-smoke.log ryzemp-update.json; do
            mkdir -p existing
            if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir existing; then
              cmp "package/$name" "existing/$name"
            else
              gh release upload "$tag" "package/$name" --repo "$GITHUB_REPOSITORY"
            fi
          done
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
