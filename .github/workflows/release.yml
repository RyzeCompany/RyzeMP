name: Build and Release Phar

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  build:
    needs: tests
    permissions:
      contents: write # required only for tagged GitHub release publication
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zlib
          ini-values: phar.readonly=Off
          tools: composer

      - name: Check release tag matches RyzeMP version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          grep -Fq "public const BASE_VERSION = \"$version\";" src/VersionInfo.php || {
            echo "Release tag $GITHUB_REF_NAME does not match VersionInfo::BASE_VERSION"
            exit 1
          }

      - name: Verify PHAR compression support
        run: |
          php -r 'if(!extension_loaded("zlib") || !Phar::canCompress(Phar::GZ)){fwrite(STDERR, "Gzip PHAR compression is unavailable\\n"); exit(1);} echo "zlib + Phar::GZ compression available\\n";'

      - name: Install dependencies
        run: composer install --no-dev --classmap-authoritative --ignore-platform-reqs
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.SUBMODULE_TOKEN }}"}}'

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find src lib generated -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Build phar
        run: php -d phar.readonly=0 build/server-phar.php --out=RyzeMP.phar

      - name: Validate phar
        run: |
          test -s RyzeMP.phar
          php -r '$p = new Phar("RyzeMP.phar"); $uncompressed=[]; foreach($p as $f){ if($f->isFile() && !$f->isCompressed(Phar::GZ)){ $uncompressed[]=$f->getPathName(); } } if($uncompressed!==[]){ fwrite(STDERR, "Uncompressed PHAR entries: " . count($uncompressed) . PHP_EOL . implode(PHP_EOL, array_slice($uncompressed, 0, 20)) . PHP_EOL); exit(1); } $size=filesize("RyzeMP.phar"); echo "PHAR OK: " . $p->getPath() . PHP_EOL; echo "FILES: " . $p->count() . PHP_EOL; echo "SIZE: " . $size . " bytes (" . round($size / 1048576, 2) . " MiB)" . PHP_EOL; if($size > 47185920){ fwrite(STDERR, "PHAR is unexpectedly large (>45 MiB) for this multi-version build" . PHP_EOL); exit(1); }'

      - name: Setup PocketMine PHP for smoke test
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: '8.4'
          install-path: ./pm-bin
          pm-version-major: 5

      - name: Smoke-test RyzeMP identity
        shell: bash
        run: |
          set -euo pipefail
          php RyzeMP.phar --version | tee /tmp/ryzemp-version.txt
          grep -q 'RyzeMP ' /tmp/ryzemp-version.txt
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            grep -Fq "RyzeMP ${GITHUB_REF_NAME#v}" /tmp/ryzemp-version.txt
          fi

      - name: Smoke-test native dimensions startup
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pm-native-dimensions-smoke
          mkdir -p /tmp/pm-native-dimensions-smoke/plugins
          cp resources/pocketmine.yml /tmp/pm-native-dimensions-smoke/pocketmine.yml
          sed -i 's/enable-dev-builds: false/enable-dev-builds: true/' /tmp/pm-native-dimensions-smoke/pocketmine.yml
          set +e
          timeout 35s php RyzeMP.phar             --no-wizard             --disable-ansi             --data=/tmp/pm-native-dimensions-smoke             --plugins=/tmp/pm-native-dimensions-smoke/plugins             > /tmp/pm-native-dimensions-smoke.log 2>&1
          status=$?
          set -e
          cat /tmp/pm-native-dimensions-smoke.log
          if grep -Eiq 'Fatal error|Uncaught|CRITICAL|EMERGENCY' /tmp/pm-native-dimensions-smoke.log; then
            echo "Fatal/critical startup error detected"
            exit 1
          fi
          grep -q 'Native dimensions: created world_nether' /tmp/pm-native-dimensions-smoke.log
          grep -q 'Native dimensions: created world_the_end' /tmp/pm-native-dimensions-smoke.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "Unexpected PocketMine exit code: $status"
            exit "$status"
          fi

      - name: Smoke-test experimental 419 with Xbox authentication required
        shell: bash
        run: |
          set -euo pipefail
          test_root=/tmp/ryzemp-419-auth-required-smoke
          mkdir -p "$test_root/plugins"
          cp resources/pocketmine.yml "$test_root/pocketmine.yml"
          sed -i 's/enable-dev-builds: false/enable-dev-builds: true/; s/enable-experimental-1-16-100: false/enable-experimental-1-16-100: true/; s/^  level: 1$/  level: 2/' "$test_root/pocketmine.yml"
          printf 'xbox-auth=on\nlevel-type=FLAT\nview-distance=4\n' > "$test_root/server.properties"
          php -dphar.readonly=0 tests/integration/build-legacy419-smoke.php "$test_root/plugins/NativeLegacySmoke.phar"
          set +e
          RYZEMP_419_EXPECT_AUTH_REJECTION=1 timeout 45s php RyzeMP.phar --no-wizard --disable-ansi --data="$test_root" --plugins="$test_root/plugins" > /tmp/ryzemp-419-auth-required-smoke.log 2>&1
          status=$?
          set -e
          cat /tmp/ryzemp-419-auth-required-smoke.log
          test "$status" -eq 0
          if grep -Eiq 'Fatal error|Uncaught|CRITICAL|EMERGENCY|LEGACY419_JOIN_SMOKE_FAILED' /tmp/ryzemp-419-auth-required-smoke.log; then exit 1; fi
          grep -q 'Legacy 419 certificate input: raw-links=1 mapped-links=1 preserved=yes' /tmp/ryzemp-419-auth-required-smoke.log
          grep -q 'verification=passed result=untrusted trusted-root=none.*single-self-issued=yes' /tmp/ryzemp-419-auth-required-smoke.log
          grep -q 'LEGACY419_AUTH_REQUIRED_SMOKE_OK rejected=self-issued xbox-auth=on chunks=0' /tmp/ryzemp-419-auth-required-smoke.log

      - name: Smoke-test experimental 419 encrypted login and world entry
        shell: bash
        run: |
          set -euo pipefail
          test_root=/tmp/ryzemp-419-smoke
          mkdir -p "$test_root/plugins"
          cp resources/pocketmine.yml "$test_root/pocketmine.yml"
          sed -i 's/enable-dev-builds: false/enable-dev-builds: true/; s/enable-experimental-1-16-100: false/enable-experimental-1-16-100: true/' "$test_root/pocketmine.yml"
          printf 'xbox-auth=off\nlevel-type=FLAT\nview-distance=4\n' > "$test_root/server.properties"
          php -dphar.readonly=0 tests/integration/build-legacy419-smoke.php "$test_root/plugins/NativeLegacySmoke.phar"
          set +e
          timeout 90s php RyzeMP.phar --no-wizard --disable-ansi --data="$test_root" --plugins="$test_root/plugins" > /tmp/ryzemp-419-smoke.log 2>&1
          status=$?
          set -e
          cat /tmp/ryzemp-419-smoke.log
          test "$status" -eq 0
          if grep -Eiq 'Fatal error|Uncaught|CRITICAL|EMERGENCY|LEGACY419_JOIN_SMOKE_FAILED' /tmp/ryzemp-419-smoke.log; then exit 1; fi
          grep -q 'LEGACY419_JOIN_SMOKE_OK encrypted=cfb8' /tmp/ryzemp-419-smoke.log
          grep -q 'LEGACY419_INVENTORY_SMOKE_OK.*auto=1 chest=1 normal-drop=1' /tmp/ryzemp-419-smoke.log
          grep -q 'Bedrock 1.16.100 (419): enabled; RakNet 10 accepted' /tmp/ryzemp-419-auth-required-smoke.log

      - name: Upload build artifact (best effort, Actions quota dependent)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: RyzeMP-phar-${{ github.sha }}
          path: RyzeMP.phar
          if-no-files-found: error

      - name: Prepare versioned PHAR and checksum
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          mv RyzeMP.phar "RyzeMP_${GITHUB_REF_NAME}.phar"
          sha256sum "RyzeMP_${GITHUB_REF_NAME}.phar" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            RyzeMP_${{ github.ref_name }}.phar
            SHA256SUMS.txt
            LICENSE
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

