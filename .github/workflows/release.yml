name: Build and Release Phar

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
  build:
    needs: tests
    uses: ./.github/workflows/ci-2225-phar-preview.yml
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RyzeMP-phar
          path: package
      - name: Publish the verified beta PHAR and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*public const BASE_VERSION = "\([^"]*\)";.*/\1/p' src/VersionInfo.php)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]
          tag="v$version"
          channel=estable
          flags=(--draft)
          if [[ "$version" == *-* ]]; then channel=pruebas; flags+=(--prerelease); fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "$tag"; fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' > /tmp/release-draft; then
            if [[ "$(cat /tmp/release-draft)" != true ]]; then
              echo "$tag already published; its assets are preserved."
              exit 0
            fi
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.target_commitish')" = "$GITHUB_SHA"
          else
            test -s "docs/releases/$version.md"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${flags[@]}" \
              --title "RyzeMP $version · Bedrock 1.26.60 / RyzeRTC" --notes-file "docs/releases/$version.md"
          fi
          (cd package && sha256sum -c SHA256SUMS.txt)
          mv package/RyzeMP.phar "package/RyzeMP_${tag}.phar"
          (cd package && sha256sum "RyzeMP_${tag}.phar" > SHA256SUMS.txt)
          cp LICENSE package/LICENSE
          python3 tools/release-manifest.py --release "$tag" --channel "$channel" \
            --phar "package/RyzeMP_${tag}.phar" --out package/ryzemp-update.json
          # Publish the manifest last; keep the release hidden until all files are ready.
          for name in "RyzeMP_${tag}.phar" SHA256SUMS.txt LICENSE native-phar-smoke.log native-prespawn-smoke.log public-command-smoke.log ryzemp-update.json; do
            mkdir -p existing
            if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir existing; then
              cmp "package/$name" "existing/$name"
            else
              gh release upload "$tag" "package/$name" --repo "$GITHUB_REPOSITORY"
            fi
          done
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
