name: Build and Release Phar

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: phar.readonly=Off
          tools: composer

      - name: Install dependencies
        run: composer install --no-dev --classmap-authoritative --ignore-platform-reqs
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.SUBMODULE_TOKEN }}"}}'

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find src generated -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build phar
        run: php -d phar.readonly=0 build/server-phar.php --out=PocketMine-MP.phar

      - name: Validate phar
        run: |
          test -s PocketMine-MP.phar
          php -r '$p = new Phar("PocketMine-MP.phar"); echo "PHAR OK: " . $p->getPath() . PHP_EOL; echo "FILES: " . $p->count() . PHP_EOL;'

      - name: Upload build artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: PocketMine-MP-phar-${{ github.sha }}
          path: PocketMine-MP.phar
          if-no-files-found: error

      - name: Rename phar
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv PocketMine-MP.phar PocketMine-MP_${{ github.ref_name }}.phar

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PocketMine-MP_${{ github.ref_name }}.phar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
