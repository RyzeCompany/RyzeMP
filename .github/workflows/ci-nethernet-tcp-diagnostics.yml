name: NetherNet identity security regression
on:
  push:
    branches: [feature/bedrock-1.26.60-nethernet]
    paths:
      - src/network/mcpe/nethernet/**
      - tests/nethernet-*
      - .github/workflows/ci-nethernet-tcp-diagnostics.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tcp-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
      - name: Syntax and JWT, DTLS signatures and persistent server identity
        run: |
          set -euo pipefail
          php -l src/network/mcpe/nethernet/NetherNetHttpServer.php
          php -l src/Server.php
          php -l src/network/mcpe/nethernet/NetherNetIdentityAssertionVerifier.php
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/ryze-nethernet-test-rsa.pem 2>/dev/null
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:secp384r1 -out /tmp/ryze-nethernet-test-ec.pem 2>/dev/null
          RYZE_TEST_RSA_PEM=/tmp/ryze-nethernet-test-rsa.pem RYZE_TEST_EC_PEM=/tmp/ryze-nethernet-test-ec.pem php tests/nethernet-identity-verifier.php
          grep -Fq 'NetherNetInterface' src/Server.php
          if grep -Eq 'nethernet-enabled=|nethernet-ice-port=19134' src/Server.php; then
            echo 'Unexpected additional NetherNet config introduced'
            exit 1
          fi
