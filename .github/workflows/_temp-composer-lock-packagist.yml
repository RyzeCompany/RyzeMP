name: Temporary regenerate Composer lockfile from public Packagist
on:
  push:
    branches: [chore/composer-packagist-direct]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: '8.4'
          install-path: ./bin
          pm-version-major: 5
      - name: Re-lock from public Packagist
        shell: bash
        run: |
          set -euo pipefail
          composer update --lock --no-install --no-interaction --no-progress
          composer validate --no-check-publish --no-interaction
          echo "__RYZEMP_LOCK_BEGIN__"
          base64 -w 120 composer.lock | sed 's/^/__RYZEMP_LOCK_LINE__/'
          echo "__RYZEMP_LOCK_END__"
          composer install --prefer-dist --no-interaction --no-progress
