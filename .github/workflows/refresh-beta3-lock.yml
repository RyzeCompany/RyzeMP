name: One-time regenerate BedrockProtocol beta.3 Composer lock

on:
  push:
    branches: [release/1.0.0-beta.5-crate-trace]
    paths:
      - '.github/workflows/refresh-beta3-lock.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Composer v2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Refresh lock from published Packagist beta.3
        shell: bash
        run: |
          set -euo pipefail
          composer clear-cache
          composer update ryzemcbe/bedrock-protocol --no-install --no-scripts --no-interaction --no-progress --ignore-platform-reqs
          composer validate --no-check-publish
          php -r '$j=json_decode(file_get_contents("composer.lock"),true,512,JSON_THROW_ON_ERROR);foreach($j["packages"] as $p){if($p["name"]==="ryzemcbe/bedrock-protocol"){if($p["version"]!=="v1.0.0-beta.3" || $p["source"]["reference"]!=="16b885860d301959548d41d001fa520fd416a9d4")throw new RuntimeException("Unexpected protocol release");echo "Verified official BedrockProtocol beta.3 and merge commit\n";exit;}}exit(1);'
      - name: Commit only regenerated composer.lock to existing beta.5 PR branch
        shell: bash
        run: |
          set -euo pipefail
          git add composer.lock
          git diff --cached --exit-code --quiet && { echo 'Composer lock did not change'; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'build: lock verified BedrockProtocol beta.3 on beta.5 release'
          git push origin HEAD:release/1.0.0-beta.5-crate-trace
