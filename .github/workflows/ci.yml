name: Regression tests
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      SUBMODULE_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: '8.4'
          install-path: ./bin
          pm-version-major: 5
      - name: Validate Composer files
        run: composer validate --no-check-publish --no-interaction
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.SUBMODULE_TOKEN }}"}}'
      - name: Validate PHP syntax including tests
        run: find src lib generated tests/phpunit -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -n -l
      - name: Verify generated block registry and state fixture
        run: |
          php build/codegen/registry-interface.php src/block generated/block
          php tests/phpunit/block/regenerate_consistency_check.php
          git diff --exit-code -- generated/block/VanillaBlocks.php tests/phpunit/block/block_factory_consistency_check.json
      - name: Verify generated configuration constants
        run: |
          php build/codegen/pocketmine-yml-property-consts.php
          git diff --exit-code -- generated/YmlServerProperties.php
      - name: Run PHPUnit
        run: php -d memory_limit=2G vendor/bin/phpunit --bootstrap vendor/autoload.php --fail-on-warning tests/phpunit
      - name: Verify native redstone in a disposable world
        shell: bash
        run: |
          set -euo pipefail
          test_root="$RUNNER_TEMP/ryzemp-redstone-smoke"
          mkdir -p "$test_root/plugins"
          cp resources/pocketmine.yml "$test_root/pocketmine.yml"
          sed -i 's/enable-dev-builds: false/enable-dev-builds: true/' "$test_root/pocketmine.yml"
          printf '%s\n' 'server-ip=127.0.0.1' 'server-port=19183' 'enable-ipv6=off' 'level-type=flat' 'xbox-auth=off' > "$test_root/server.properties"
          php -dphar.readonly=0 tests/integration/build-redstone-smoke.php "$test_root/plugins/NativeRedstoneSmoke.phar"
          status=0
          timeout 60s php src/PocketMine.php --no-wizard --disable-ansi --data="$test_root" --plugins="$test_root/plugins" > "$test_root/server.log" 2>&1 || status=$?
          cat "$test_root/server.log"
          test "$status" -eq 0
          if grep -Eiq 'Fatal error|Uncaught|CRITICAL|EMERGENCY' "$test_root/server.log"; then exit 1; fi
          grep -Fq 'NATIVE_REDSTONE_WORLD_SMOKE_OK wire=15,14,13 off=0 lamp=on,off' "$test_root/server.log"
          grep -Fq 'NATIVE_REDSTONE_TIMING_SMOKE_OK repeater=6gt torch=2gt comparator=1,15,0 tile=15' "$test_root/server.log"


