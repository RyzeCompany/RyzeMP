name: Regression tests
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      SUBMODULE_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: '8.4'
          install-path: ./bin
          pm-version-major: 5
      - name: Validate Composer files
        run: composer validate --no-check-publish --no-interaction
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.SUBMODULE_TOKEN }}"}}'
      - name: Validate PHP syntax including tests
        run: find src generated tests/phpunit -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -n -l
      - name: Verify generated block registry and state fixture
        run: |
          php build/codegen/registry-interface.php src/block generated/block
          php tests/phpunit/block/regenerate_consistency_check.php
          git diff --exit-code -- generated/block/VanillaBlocks.php tests/phpunit/block/block_factory_consistency_check.json
      - name: Verify generated configuration constants
        run: |
          php build/codegen/pocketmine-yml-property-consts.php
          git diff --exit-code -- generated/YmlServerProperties.php
      - name: Static-analyze native dimensions
        continue-on-error: true
        if: github.head_ref == 'feature/native-nether-end' || github.ref == 'refs/heads/feature/native-nether-end'
        run: |
          mkdir -p build/php
          php -d memory_limit=2G vendor/bin/phpstan analyse --no-progress src/world/dimension src/block/Fire.php src/block/EndPortalFrame.php src/block/NetherPortal.php src/network/mcpe/cache/ChunkCache.php src/network/mcpe/NetworkSession.php src/network/mcpe/handler/PreSpawnPacketHandler.php src/network/mcpe/handler/InGamePacketHandler.php src/player/Player.php

      - name: Run PHPUnit
        run: php -d memory_limit=2G vendor/bin/phpunit --bootstrap vendor/autoload.php --fail-on-warning tests/phpunit
