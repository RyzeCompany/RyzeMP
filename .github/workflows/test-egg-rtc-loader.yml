name: Smoke-test Egg native RTC against official PocketMine PHP

on:
  push:
    branches: [feature/bedrock-1.26.60-nethernet]
    paths: [.github/workflows/test-egg-rtc-loader.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-rtc-loader:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download the EXACT PHP from the existing RyzeMP Egg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ryze-egg
          curl --fail --location --silent --show-error --retry 3 \
            'https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-8.4-latest/PHP-8.4-Linux-x86_64-PM5.tar.gz' \
            -o /tmp/ryze-egg/php.tar.gz
          echo '5b9a1a8f103f7b91670336495b531d9a75c05cca3bd544251a7b63d2124bcc6c  /tmp/ryze-egg/php.tar.gz' | sha256sum -c -
          tar -xzf /tmp/ryze-egg/php.tar.gz -C /tmp/ryze-egg
          /tmp/ryze-egg/bin/php7/bin/php -n -v
      - name: Download the exact verified RTC release intended for the Egg
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ryze-egg
          curl --fail --location --silent --show-error --retry 3 \
            'https://github.com/RyzeCompany/RyzeMP/releases/download/ryzemp-rtc-php84-zts-v1/ryzemp-rtc-linux-x86_64-php84-zts-v1.zip' \
            -o rtc.zip
          echo '18d9bf2e2b5c0822bccb88d433cdfeb6fce8ead6603a8b10859a732314d512a6  rtc.zip' | sha256sum -c -
          mkdir -p native
          unzip -p rtc.zip .build/rtc/extension/modules/rtc.so > native/rtc.so
          unzip -p rtc.zip .build/rtc/install/lib/libdatachannel.so.0.24 > native/libdatachannel.so.0.24
          unzip -p rtc.zip .build/openssl/lib/libssl.so.3 > native/libssl.so.3
          unzip -p rtc.zip .build/openssl/lib/libcrypto.so.3 > native/libcrypto.so.3
          echo "Native libraries and PHP ABI:"
          /tmp/ryze-egg/bin/php7/bin/php -n -i | grep -E 'PHP API =>|Thread Safety =>|PHP Version =>'
          LD_LIBRARY_PATH=/tmp/ryze-egg/native ldd native/rtc.so
      - name: Load native extension with EXACT installed PHP
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ryze-egg
          LD_LIBRARY_PATH=/tmp/ryze-egg/native \
            ./bin/php7/bin/php -n -d extension=/tmp/ryze-egg/native/rtc.so \
              -r 'if(!extension_loaded("rtc") || !class_exists("amber\rtc\RtcRuntime",false) || \amber\rtc\RtcRuntime::getApiVersion() !== 1){exit(1);} echo "RTC loaded successfully on exact Egg PHP\n";'
